name: Publish MyOutlet to Wix

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wix.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-wix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myoutlet-wix-production
  cancel-in-progress: false

jobs:
  check_credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Check whether Wix publishing credentials are configured
        id: detect
        shell: bash
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          if [[ -n "$WIX_CLI_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing is waiting for the WIX_CLI_API_KEY repository secret."
          fi

  publish:
    needs: check_credentials
    if: needs.check_credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the MyOutlet site repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install site dependencies and Wix CLI
        run: npm ci
      - name: Authenticate Wix CLI
        run: npm run wix login -- --api-key "$WIX_CLI_API_KEY"
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
      - name: Publish the default-branch site code
        run: npm run wix publish
