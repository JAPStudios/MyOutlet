name: Validate MyOutlet backend

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/public/**"
      - "src/pages/**"
      - "CMS_COLLECTIONS.md"
      - "README.md"
      - "wix.config.json"
      - "package.json"
      - "scripts/**"
      - "LIVE_STREAMING.md"
      - "UPSTREAM_COMPONENTS.md"
      - ".gitmodules"
      - "live-streaming/**"
      - ".github/workflows/validate-backend.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - "src/public/**"
      - "src/pages/**"
      - "CMS_COLLECTIONS.md"
      - "wix.config.json"
      - "package.json"
      - "scripts/**"
      - "LIVE_STREAMING.md"
      - "live-streaming/**"
      - ".github/workflows/validate-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Velo JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check --input-type=module < "$file"
          done < <(find src/backend src/public src/pages -type f \( -name '*.js' -o -name '*.jsw' \) -print0)
      - name: Validate backend contracts
        run: node scripts/validate-backend.js
      - name: Validate live authorization and notification regression cases
        run: node scripts/validate-live-auth.js
      - name: Validate public application and HTTP routes
        run: node scripts/validate-public-app.js
      - name: Verify deployed frontend asset delivery
        shell: bash
        run: |
          set -euo pipefail
          url="https://myoutlet-frontend-assets-production.up.railway.app/myoutlet-app.js"
          curl --fail --silent --show-error --dump-header /tmp/myoutlet-headers "$url" --output /tmp/myoutlet-app.js
          grep -Eiq '^content-type: application/javascript([;[:space:]]|$)' /tmp/myoutlet-headers
          grep -Fq 'root.id = "myoutlet-app"' /tmp/myoutlet-app.js
          grep -Fq 'document.body.insertBefore(root, document.body.firstChild)' /tmp/myoutlet-app.js
      - name: Verify published Wix homepage references the frontend asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://japbstudios.wixsite.com/myoutlet" --output /tmp/myoutlet-wix-homepage.html
          grep -Fq 'myoutlet-frontend-assets-production.up.railway.app/myoutlet-app.js' /tmp/myoutlet-wix-homepage.html
          grep -oEi '<meta[^>]*viewport[^>]*>' /tmp/myoutlet-wix-homepage.html | head -n 5 || true
          grep -oEi 'MyOutlet Mobile Viewport.{0,300}' /tmp/myoutlet-wix-homepage.html | head -n 2 || true
      - name: Verify MyOutlet renders in desktop and mobile browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const viewport of [
                { name: 'desktop', width: 1440, height: 1000 },
                { name: 'mobile', width: 390, height: 844 }
              ]) {
                const page = await browser.newPage({
                  viewport: { width: viewport.width, height: viewport.height },
                  isMobile: viewport.name === 'mobile',
                  hasTouch: viewport.name === 'mobile'
                });
                const pageErrors = [];
                page.on('pageerror', error => pageErrors.push(error.message));
                const response = await page.goto('https://japbstudios.wixsite.com/myoutlet', {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });
                if (!response || !response.ok()) {
                  throw new Error('Wix homepage returned an unsuccessful response on ' + viewport.name);
                }
                await page.waitForSelector('#myoutlet-app', { timeout: 60000 });
                await page.waitForFunction(expectedWidth => window.innerWidth === expectedWidth, viewport.width, { timeout: 10000 });
                const dimensions = await page.locator('#myoutlet-app').evaluate(element => ({
                  width: element.getBoundingClientRect().width,
                  height: element.getBoundingClientRect().height,
                  textLength: element.innerText.length,
                  viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  viewportMeta: document.querySelector('meta[name="viewport"]')?.content || null
                }));
                if (dimensions.viewportWidth !== viewport.width) {
                  throw new Error('Mobile viewport scaling is incorrect on ' + viewport.name + ': ' + JSON.stringify(dimensions));
                }
                if (dimensions.width < 300 || dimensions.height < 200 || dimensions.textLength < 100) {
                  throw new Error('MyOutlet did not visibly render on ' + viewport.name + ': ' + JSON.stringify(dimensions));
                }
                if (dimensions.documentWidth > viewport.width + 2) {
                  throw new Error('MyOutlet overflows horizontally on ' + viewport.name + ': ' + JSON.stringify(dimensions));
                }
                if (pageErrors.length) {
                  throw new Error('Browser JavaScript errors on ' + viewport.name + ': ' + JSON.stringify(pageErrors));
                }
                console.log('MyOutlet ' + viewport.name + ' render passed: ' + JSON.stringify(dimensions));
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Validate MediaMTX configuration
        run: |
          mkdir -p live-streaming/certs
          openssl req -x509 -nodes -newkey rsa:2048 -keyout live-streaming/certs/privkey.pem -out live-streaming/certs/fullchain.pem -subj /CN=localhost -days 1
          docker run --rm -v "$PWD/live-streaming/mediamtx.yml:/etc/mediamtx/mediamtx.yml:ro" -v "$PWD/live-streaming/certs:/etc/mediamtx/certs:ro" -w /etc/mediamtx bluenviron/mediamtx:1.21.3 --validate-conf=/etc/mediamtx/mediamtx.yml
          docker compose -f live-streaming/compose.yaml config --quiet
