name: Validate MyOutlet backend

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - "src/public/**"
      - "src/pages/**"
      - "CMS_COLLECTIONS.md"
      - "wix.config.json"
      - "package.json"
      - "scripts/**"
      - "LIVE_STREAMING.md"
      - "UPSTREAM_COMPONENTS.md"
      - ".gitmodules"
      - "live-streaming/**"
      - ".github/workflows/validate-backend.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - "src/public/**"
      - "src/pages/**"
      - "CMS_COLLECTIONS.md"
      - "wix.config.json"
      - "package.json"
      - "scripts/**"
      - "LIVE_STREAMING.md"
      - "live-streaming/**"
      - ".github/workflows/validate-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Velo JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check --input-type=module < "$file"
          done < <(find src/backend src/public src/pages -type f \( -name '*.js' -o -name '*.jsw' \) -print0)
      - name: Validate backend contracts
        run: node scripts/validate-backend.js
      - name: Validate live authorization and notification regression cases
        run: node scripts/validate-live-auth.js
      - name: Validate MediaMTX configuration
        run: |
          mkdir -p live-streaming/certs
          openssl req -x509 -nodes -newkey rsa:2048 -keyout live-streaming/certs/privkey.pem -out live-streaming/certs/fullchain.pem -subj /CN=localhost -days 1
          docker run --rm -v "$PWD/live-streaming/mediamtx.yml:/etc/mediamtx/mediamtx.yml:ro" -v "$PWD/live-streaming/certs:/etc/mediamtx/certs:ro" -w /etc/mediamtx bluenviron/mediamtx:1.21.3 --validate-conf=/etc/mediamtx/mediamtx.yml
          docker compose -f live-streaming/compose.yaml config --quiet
