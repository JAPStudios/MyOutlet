name: Publish MyOutlet frontend asset

on:
  push:
    branches:
      - main
    paths:
      - "src/public/myoutlet-app.js"
      - ".github/workflows/publish-myoutlet-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: myoutlet-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out MyOutlet
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the application script
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/public

      - name: Deploy the application script
        id: deployment
        uses: actions/deploy-pages@v4
